name: 打包安卓App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 准备网页文件
        run: |
          mkdir -p app/www
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png app/www/

      - name: 创建安卓项目
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "提问与筛选" com.gracecstar.tiwen --web-dir www
          npx cap add android
          npx cap sync android

      - name: 换上App图标
        run: |
          RES=app/android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp android-icon-$s.png $RES/mipmap-$d/$n.png
            done
          done

      - name: 打包APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../tiwen.apk

      - name: 发布下载
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 提问与筛选 第${{ github.run_number }}版
          body: 在安卓手机上下载 tiwen.apk，点开安装即可。
          files: tiwen.apk
          make_latest: true
